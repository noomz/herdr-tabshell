set -g mouse on
set -g detach-on-destroy on
set -s set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
# herdr's default prefix is C-b and it catches C-b before the float sees it.
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
source-file -q "$HERDR_PLUGIN_CONFIG_DIR/tmux.conf"
