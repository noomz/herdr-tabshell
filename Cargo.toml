[package]
name = "herdr-tabshell"
version = "0.1.0"
edition = "2021"
description = "A persistent shell for each herdr tab"
license = "Apache-2.0"
repository = "https://github.com/noomz/herdr-tabshell"
readme = "README.md"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
